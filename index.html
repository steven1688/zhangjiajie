{d:"12/04（五）",r:"武陵源：袁家界・天子山・大峽谷",tl:[["07:00","早餐，07:45 出發"],["09:00","百龍電梯、袁家界：天下第一橋、迷魂臺"],["12:30","午餐：山頂風味"],["13:30","天子山：賀龍公園、西海石林，搭索道下山"],["16:30","大峽谷（含玻璃橋往返），體力不足可在入口休息"],["18:30","晚餐：滴水洞"]],m:"早 酒店內｜午 山頂風味 50R｜晚 滴水洞 50R",c:"武陵源是石英砂岩峰林，世界自然遺產。天下第一橋是一塊天然石板連接兩峰，寬約2公尺、長20餘公尺。百龍電梯是世界最高的戶外觀光電梯。",f:"土家三下鍋、張家界莓茶、葛根粉、臘肉。",p:"天下第一橋雙手張開像「撐住山」；迷魂臺欄杆旁夫妻合照；西海石林舉手撐山。",w:"武陵源 18°／11°（夜間體感7°）；白天雨59%、夜間雨75%；陣風15–26 km/h。山上我估計再低4–6°"},

{d:"12/06（日）",r:"常德→岳陽→武漢",tl:[["07:30","早餐，08:30 出發"],["08:30","車程約2小時前往岳陽"],["10:30","遠觀洞庭湖、岳陽樓外觀"],["12:00","午餐：岳陽風味"],["13:00","車程約3小時前往武漢"],["17:00","入住、晚餐：武漢風味"],["19:00","前往江漢路約40–50分鐘；江漢路與江灘燈光秀；約22:15返回酒店"]],m:"早 酒店內｜午 岳陽風味 50R｜晚 武漢風味 50R",c:"岳陽樓因范仲淹〈岳陽樓記〉聞名，木構不用一根鐵釘。江漢路是武漢百年商業老街，有「小香港」之稱。",f:"熱乾麵、豆皮、周黑鴨、牛肉粉、麵窩；洞庭銀魚、君山銀針。",p:"岳陽樓前三排團體照；江邊欄杆以燈光為背景；江漢路老建築前斜排。",w:"尚無預報（只到12/04）。趨勢：約18–20°／11–13°、連日有雨；江邊風大"},
{d:"12/07（一）",r:"武漢→香港→高雄",tl:[["07:00","早餐，07:30 出發前往天河機場（約1–1.5小時）"],["09:15","機場辦理登機"],["11:45","CX937 武漢→香港（14:10 抵）"],["14:10","香港轉機：補水、Bacha Coffee；16:15 前到登機門"],["16:45","CX458 香港→高雄（18:15 抵）"]],m:"早 酒店內｜午、晚 機上或自理",c:"退房前檢查證件、藥品、充電器；行動電源只能隨身帶。",f:"",p:"",w:"尚無預報（只到12/04），出發前三天請再查"}];
const X=[{"s": "【國泰航空 CX423／CX938】【武漢接機、送酒店休息】", "tl": [["11:15", "小港機場國泰櫃台集合、託運行李"], ["13:15–15:00", "CX423 高雄→香港（約1小時45分）"], ["15:00–17:30", "香港轉機：轉機後先補水，再喝咖啡休息；17:00 前回到登機門"], ["17:30–19:35", "CX938 香港→武漢（約2小時5分）"], ["20:15", "入境接機，車程約20–30分、約15公里"], ["21:00", "入住休息"]], "i": "<p>貴賓從高雄小港機場出發，搭乘客機經香港飛往【武漢】。</p><p>武漢，簡稱「漢」，別稱「江城」，是湖北省省會，中國中部地區最大都市及唯一的副省級城市，也是中國內陸地區最繁華的都市、區域中心城市。早在6000年前的新石器時代，已有先民在此繁衍生息。北郊的盤龍城遺址是武漢建城的開端，距今有3500年歷史。民國時期漢口高度繁榮，被譽為「東方芝加哥」，武漢三鎮綜合實力曾僅次於上海，位居亞洲前列。</p><p>武漢地處江漢平原東部。世界第三大河長江及其最大支流漢水橫貫市境中央，將武漢城區一分為三，形成武昌、漢口、漢陽三鎮隔江鼎立的格局。唐朝詩人李白曾在此寫下「黃鶴樓中吹玉笛，江城五月落梅花」，因此武漢自古又稱江城。全市現轄13個城區、3個國家級開發區，面積8467平方公里；境內江河縱橫、湖港交織，上百座大小山巒、166個湖泊座落其間，水域面積約占全市面積四分之一，構成極具特色的濱江濱湖水域生態環境。</p><p>武漢是中國重要的科研教育基地。截至2014年，在漢高等院校98所，普通高校和本科院校數僅次於北京，居中國第二；在校大學生和研究生總數107.26萬人，居世界第一。</p><p>2016年10月，中共中央發佈的《長江經濟帶發展規劃綱要》將武漢列為超大城市；同年12月，國家發改委明確要求武漢加快建成以全國經濟中心、高水準科技創新中心、商貿物流中心和國際交往中心四大功能為支撐的國家中心城市。</p>", "w": "武漢：白天 23°C（體感 23°C），晚上 10°C（體感 10°C）；晴；東南風 11 km/h，陣風 19 km/h；降雨機率 0%。晚上抵達時偏涼，請帶外套。<br><span class='sm'>預報更新於 11/25，出發前請再確認。</span>", "f": "熱乾麵：鹼麵拌芝麻醬、蘿蔔丁、蔥花。豆皮：糯米、蛋皮、肉末、香菇煎成。湖北臍橙、柑橘在此時節上市，可在水果店挑選。"}, {"s": "【荊州古城】（包電瓶車）【常德大小河街】【柳葉湖】", "tl": [["07:30", "酒店早餐"], ["08:30–12:00", "車程約3.5小時、約250公里，中途休息一次"], ["12:00–13:00", "午餐：荊州風味"], ["13:00–14:30", "荊州古城（含電瓶車）"], ["14:30–17:00", "車程約2–2.5小時、約160公里，前往常德"], ["17:00–18:00", "常德大小河街"], ["18:00–19:00", "晚餐：常德風味"], ["19:00–20:00", "柳葉湖夜景，視天候縮短"]], "i": "<p>早餐後乘車前往【荊州古城】（包電瓶車）。荊州是中國歷史文化名城之一，保存有較完好的古城牆：城內東西直徑3.75公里，南北直徑1.2公里，面積4.5平方公里；城牆周長10.5公里，高8.83米，共有六座城門，每座城門上均建有城樓。</p><p>荊州古城牆始建於春秋戰國時期，曾是楚國的官船碼頭和渚宮，後成為江陵縣治所，出現了最初的城廓。經過三百五十多年的風雨，現存的古城牆大部分為明末清初建築。現聳立在人們眼前的雄偉磚城，為明清兩代所修造，逶迤挺拔、完整而又堅固，是中國府城中保存最為完好的古城垣。</p><p>【常德大小河街】可追溯至明朝正德年間，早年依傍沅江而建，因地勢低窪，每逢洪水便積水成河，因此得名「河街」。隨著水運興盛，河街逐漸發展成常德重要的商貿集散地，商賈雲集，茶樓、客棧、戲院林立，見證了昔日常德的繁華景象，也成為當地重要的文化象徵。</p><p>【柳葉湖】柳葉湖是一個生態樂園，水質常年保持二類，屬於零污染，水域面積約21.8平方公里。柳葉湖也是度假勝地，環湖兩岸的農家樂、漁家樂餐廳形成一條美食街，可以品農家菜、捕魚、抓蝦，悠然自樂。</p><p>柳葉湖是天造的生態盆景，度假區集城、湖、山、洲為一體，是天然造化的生態組合盆景。柳葉湖距城區2.5公里，古有「堤柳漁歌、松風水帶，皆極共勝」之描述，今有「湖南一寶、常德一絕」之讚歎。規劃總面積44.96平方公里，其中水域面積21.8平方公里，約為杭州西湖的3倍，規模之大，全國絕無僅有。</p><p>柳葉湖湖水明淨，水域遼闊，湖底平坦，是理想的天然水上競技場。1995年以來，湖南省八運會皮划艇決賽、全國皮划艇冠軍賽和全國皮划艇錦標賽都曾在這裡隆重舉行。柳葉湖以一流的比賽場所和優美的環境，贏得各國運動員和廣大遊客的好評，被人譽為「水上天堂」。</p>", "w": "<ul><li>武漢（早上）：白天 22°C（體感 24°C），晴，東南風 7 km/h，陣風 17 km/h，降雨 3%。</li><li>常德：白天 21°C（體感 24°C），降雨 6%；晚上 14°C（體感 13°C），雷雨機率 66%（約 15 mm），風 6 km/h，陣風 17 km/h。</li><li>荊州沒有單獨查到預報，可參考武漢與常德。</li></ul>傍晚到晚上有雷雨，柳葉湖夜景可能要取消，請帶雨具。<br><span class='sm'>預報更新於 11/25，出發前請再確認。</span>", "f": "<b>常德大小河街－美食建議：</b>常德米粉、瑞幸咖啡、長沙臭豆腐、擼串。<br>荊州魚糕：魚漿蒸製，口感彈嫩。皮條鱔魚：鱔魚切條燉煮。常德石門一帶的柑橘，這時節可買。", "p": "獨照：站城門樓下，單手叉腰望向遠方。夫妻照：並肩靠城牆，一人指前方、一人比愛心。朋友照：排成斜線，同時舉手扮「出征」。團體照：城門樓前三排，前排蹲、後排站。", "pt": "拍照建議（荊州古城牆）"}, {"s": "【鳳凰古城】（含接駁車）：東門城樓、萬名塔、吊腳樓、石板街、沱江泛舟", "tl": [["07:30", "早餐，08:30 出發"], ["08:30–12:30", "車程約4小時、約270公里，中途休息一次"], ["12:30–13:30", "午餐：酒店合菜"], ["14:00–17:30", "鳳凰古城（含接駁車）：東門城樓、萬名塔、吊腳樓、石板街"], ["17:30–18:30", "晚餐：古城風味"], ["19:00–21:00", "古城夜遊、沱江泛舟、自由活動"]], "i": "<p>早餐後，乘車前往【鳳凰古城】（含接駁車）。鳳凰古城，一個位在湘西的百年古鎮，同時也是湖南十大文化遺產之一，有「中國最美麗的小城」之美名！比起江南水都，這裡擁有更多風俗民情，可說是來湖南必訪的重要5A級景區。沿著沱江兩側而建、完整保存吊腳樓建築特色，白天、晚上能看到不同的古城風貌，與雲南麗江古城、山西平遙古城媲美，享有「北平遙，南鳳凰」之美譽。</p><p>安排夜遊【沱江泛舟】，從「水上角度」欣賞吊腳樓與古城夜景，與走在岸邊的感覺完全不同，是多數旅客回程後最印象深刻的體驗之一。</p>", "w": "鳳凰：白天 19°C（體感 20°C），晚上 12°C（體感 12°C）；上午有陣雨或雷雨，降雨機率 55%（約 7.5 mm），其餘時間多雲；北風 6 km/h，陣風 15 km/h；夜間降雨機率 25%。請帶雨傘或輕便雨衣、防滑鞋。<br><span class='sm'>預報更新於 11/25，出發前請再確認。</span>", "f": "血粑鴨：鴨肉與血粑、辣椒同炒。鳳凰薑糖：老薑熬糖拉製，暖身。酸蘿蔔、臘肉。湘西麻陽冰糖橙，這時節上市。米酒、扎染布可當伴手禮。", "p": "獨照：倚虹橋欄杆，側臉看燈光。夫妻照：背對吊腳樓，牽手看彼此。朋友照：沿石板街排成一列往前走。團體照：東門城樓石階，高處往下拍。夜景：用河燈做前景拍剪影。", "pt": "拍照建議（虹橋、沱江夜景）", "e": [["🍴 鳳凰古城－美食建議", "<ul><li><b>滿食蝦餅</b>：地點在江邊，位置好所以人潮多。</li><li><b>吳記苗餅</b>：口感有點乾；愛吃辣的話，湖南的各種辣醬一定要加。</li><li><b>石磨黃金玉米餅</b>：3塊15人民幣，有點像我們的車輪餅，但裡頭沒有玉米粒，玉米已磨成漿融入麵皮，QQ軟軟的，味道簡單純粹。</li><li><b>翠翠茶</b>：在虹橋附近，融合苗族元素。苗族飾品需加購：杯子有銀飾，竹編提籠挺漂亮。奶蓋的喝法在中國很流行，一杯500cc，價格不便宜。<br>地址：湖南省湘西土家族苗族自治州鳳凰縣虹橋中路101號。</li></ul>"]]}, {"s": "【芙蓉鎮】（含遊船＋電瓶車）【王村瀑布】【西水畫廊】【七十二奇樓夜景】（外觀）", "tl": [["07:30", "早餐，08:30 出發"], ["08:30–10:30", "車程約2–2.5小時、約130公里，前往芙蓉鎮"], ["10:30–12:30", "芙蓉鎮（含遊船＋電瓶車）、王村瀑布、酉水畫廊"], ["12:30–13:30", "午餐：苗王宴"], ["14:00–16:30", "車程約2小時、約120公里，前往張家界市"], ["17:00–18:00", "晚餐：韓式烤肉"], ["19:00–21:00", "七十二奇樓夜景（外觀）"]], "i": "<p>早餐後，乘車前往【芙蓉鎮】（含遊船＋電瓶車）。芙蓉鎮是一座土家族人聚居的古鎮，鎮中至今保存完好的青石板路以及古民居（主要是吊腳樓），謝晉的名片《芙蓉鎮》就是在這裡拍攝的。在芙蓉鎮上一定要吃當地特產「米豆腐」，據說最正宗的一家在牌坊附近，就是電影中的那家米豆腐店。</p><p>【王村瀑布】從懸崖直瀉入酉水，是芙蓉鎮的標誌風景；【西水畫廊】指酉水河兩岸的山水風光，搭船遊覽。</p><p>【七十二奇樓夜景】位於湖南省張家界市，建築面積達16萬平方米，是張家界最大的仿古建築群。七十二奇樓以其獨特的建築風格和文化內涵，吸引眾多遊客前來遊覽。傳說這裡原名「陳家鋪」，是當年陳氏家族的聚居地，後來逐漸演變成一個集市。如今已成為一個集旅遊、購物、餐飲、文化體驗為一體的綜合性景區，遊客可以在此感受古城的魅力，領略張家界的傳統文化。</p>", "w": "<ul><li>鳳凰（早上）：白天 19°C（體感 19°C），晚上 12°C（體感 11°C）；少量降雨，機率 55%（約 0.6 mm）；東北風 6 km/h，陣風 15 km/h。</li><li>張家界市區：白天 19°C（體感 20°C），夜間 12°C（體感 11°C）；白天風 2 km/h，陣風 9 km/h；夜間降雨機率 64%（約 8 mm）。</li></ul>七十二奇樓夜景請備雨具。<br><span class='sm'>預報更新於 11/25，出發前請再確認。</span>", "f": "米豆腐：大米磨漿凝固切塊，淋辣椒、酸菜、蔥花，是芙蓉鎮名物。土家擂茶：茶葉、芝麻、花生研磨沖泡，冬天暖胃。土家臘肉：柏枝煙燻。", "p": "獨照：站木橋中央，瀑布當背景。夫妻照：青石板上手牽手向前走。朋友照：每人捧一碗米豆腐假裝乾杯。團體照：瀑布前階梯，三排站好。", "pt": "拍照建議（芙蓉鎮瀑布）", "e": [["⚠️ 提醒", "芙蓉鎮米豆腐口感偏鹼，部分人難以接受，建議慎入。"], ["🍴 七十二奇樓－美食建議", "<ul><li><b>新疆烤饢</b></li><li><b>茶顏悅色</b>：2013年創立於中國湖南長沙的中式古風茶飲品牌，主打「中茶西做」與古典文化包裝。品牌堅持全直營、不開放加盟。</li><li>招牌飲品：<b>幽蘭拿鐵</b>（紅茶搭配鮮奶、奶油與碧根果碎）、<b>聲聲烏龍</b>（蜜桃烏龍茶底，口感清爽）等，單杯價格多落在人民幣十幾至二十元左右。</li><li>部分鮮奶茶頂部有奶油與堅果，常見喝法是先挑食奶油與堅果再攪拌；尖峰時段可能需要排隊。</li></ul>"]]}, {"s": "【袁家界】（百龍電梯上行）【天下第一橋】【迷魂臺】【天子山】【賀龍公園】【西海石林】（天子山索道下山）【大峽谷】（含玻璃橋往返）", "tl": [["07:00", "早餐，07:45 出發，車程約40分鐘"], ["09:00–12:30", "百龍電梯上山、袁家界：天下第一橋、迷魂臺"], ["12:30–13:30", "午餐：山頂風味"], ["13:30–16:30", "天子山：賀龍公園、西海石林，搭索道下山"], ["16:30–18:00", "大峽谷（含玻璃橋往返），體力不足可在入口休息"], ["18:30", "晚餐：滴水洞"]], "i": "<p>早餐後，乘車前往【袁家界風景區】，特別安排搭乘【百龍觀光電梯】上行。百龍電梯擁有三項世界紀錄：世界上最快的客運電梯、載重量最大的電梯，也是世界最高、暴露在戶外的觀光電梯。</p><p class=\"sm\">註：若遇天候或設備檢修維護等不可抗力之因素，遊覽的交通工具以景區調配為主，敬請見諒。</p><p>【天下第一橋】位於張家界國家森林公園袁家界景區內，處於砂刀溝盡頭右側，是武陵源的精華景點之一。這座橋是世界上最高的天然石橋，大自然的鬼斧神工，將一塊厚約4公尺的天然石板橫空「架」在兩座山峰之上，把東西兩峰連接。橋面寬約2公尺，長20餘公尺，海拔350公尺，其高度、跨度和驚險均為天下罕見，故稱「天下第一橋」。</p><p>【天子山自然保護區】包含賀龍公園、西海石林，並搭乘天子山索道下山。保護區總面積為9000餘公頃，近一百平方公里；境內最高點昆侖峰海拔1262.5米，最低點泗南峪海拔534米。天子山的神奇，在於煙雲繚繞的奇石危峰，如柱、如塔、如筍，低者數丈，高者數十丈，雕鏤百態。有屈子行吟、姐妹私語、夫妻情深、眾仙聚會、群娥起舞、天兵出征等天然群像。當地群眾稱形同武將的石柱為「四十八大將軍，四十八小將軍」，擺起八門鎖陣，天子坐朝閱兵。</p><p>【大峽谷】（含玻璃橋往返）：下午行程較滿，體力不足可在入口休息。</p><p class=\"sm\">小提醒：張家界多為山地與森林，濕氣重，帶雙替換襪子或鞋墊很實用。搭乘纜車、玻璃橋，建議穿著方便活動的衣物。氣候偏濕，帶件薄外套可防早晚涼意與蚊蟲叮咬。</p>", "w": "武陵源：白天 18°C（體感 18°C），夜間 11°C（體感 7°C）；白天少量降雨，機率 59%（約 1.3 mm）；東南偏東風 6 km/h，陣風 15 km/h；夜間降雨機率 75%（約 11 mm），陣風 26 km/h。<br>這是山下的預報。天子山與索道上方，我估計再低 4–6°C，且可能有霧，請穿防風防水外套、帶雨具。景區交通工具以現場調度為準。<br><span class='sm'>預報更新於 11/25，出發前請再確認。</span>", "f": "土家三下鍋：臘肉、豆腐、蘿蔔等同煮的湯鍋。張家界莓茶（藤茶）：味苦回甘。葛根粉、臘肉可買真空包裝。獼猴桃、柑橘以市場有賣為準。", "p": "獨照：背對峰林，雙手張開像「撐住山」。夫妻照：欄杆旁相擁看遠處。朋友照：並肩排開，同時指向峰林。團體照：觀景台，請導遊拍。", "pt": "拍照建議（天下第一橋、迷魂臺）"}, {"s": "【軍聲畫院】【天門山國家森林公園】（索道、穿山手扶梯、天門洞、天空步道含鞋套）", "tl": [["07:30", "早餐，08:30 出發"], ["09:00–10:00", "軍聲畫院（砂石畫）"], ["10:00–12:00", "前往天門山，搭索道上山"], ["12:00–13:00", "午餐：蘑菇風味"], ["13:00–17:00", "天門山：穿山手扶梯、天門洞、天空步道（鞋套）"], ["17:00–19:30", "車程約2小時、約150公里，前往常德"], ["19:30", "晚餐：景上禾"]], "i": "<p>早餐後，乘車前往【軍聲畫院】。這是國家3A級旅遊景點，距離武陵源風景名勝區約35公里。畫院由畫家李軍聲於2001年創建，是展示新型繪畫種類——砂石畫的專題展館。</p><p>【天門山國家森林公園】（索道、穿山手扶梯、天門洞、天空步道含鞋套）。據2015年12月27日湖南省林業局官網顯示，總面積3037.3公頃，高1518.6米，山頂面積達2平方公里；森林公園面積因人工種林或旅遊開發，會有浮動。1994年設立公園管理機構「天門山國家森林公園管理處」，同時也是國家AAAAA旅遊景區，位於張家界市城區南郊8公里，屬於山嶽型自然景區。</p>", "w": "AccuWeather 目前只預報到 12/04，這天還沒有預報。前幾天的趨勢是：平地白天約 18–20°C、夜間約 11–13°C，連日有雨。天門山山頂我估計比平地低 5–8°C，風大，可能有霧，玻璃棧道可能臨時關閉。請穿防風外套、帶雨具，出發前三天再更新。", "f": "山菇、蘑菇入菜很鮮。砂石畫小件可當紀念。茶顏悅色、瑞幸回常德市區再買較方便。", "p": "獨照：仰拍天門洞。夫妻照：靠玻璃步道邊遠眺山谷。朋友照：背對山谷排成一列。團體照：天門洞前台階三排。懼高者不要勉強。", "pt": "拍照建議（天門洞、天空步道）"}, {"s": "【遠觀洞庭湖】【岳陽樓外觀】【江漢路步行街】【江灘燈光秀】", "tl": [["07:30", "早餐，08:30 出發"], ["08:30–10:30", "車程約2小時、約150公里，前往岳陽"], ["10:30–12:00", "遠觀洞庭湖、岳陽樓外觀"], ["12:00–13:00", "午餐：岳陽風味"], ["13:00–16:30", "車程約3小時、約200公里，前往武漢"], ["17:00–18:00", "入住、晚餐：武漢風味"], ["19:00–22:15", "前往江漢路約40–50分鐘、約20公里（概估）；江漢路與江灘燈光秀約1.5小時；約22:15返回酒店"]], "i": "<p>早餐後，乘車前往【遠觀洞庭湖】。洞庭湖是中國第二大淡水湖，是長江重要的調蓄湖泊，湖泊寬廣，湖水清澈，湖邊風光宜人。</p><p>【岳陽樓外觀】因范仲淹的《岳陽樓記》而聞名，自古有「洞庭天下水，岳陽天下樓」之譽。岳陽樓的建築很有特色，整個建築沒有用一顆鐵釘、一道橫梁，這在中國古典建築史上極為罕見。</p><p>【江漢路步行街】曾有「車馬如梭人似織，夜深歌吹未曾休」的詩句來形容它，也有「小香港」的說法，是武漢著名的百年商業老街。歷史上，江漢路實際上是華人與洋人的分界線，也是有名的商業門店集中區。街上匯集眾多百貨公司和時尚品牌店，可以隨意走進耐克、阿迪達斯、森馬、真維斯等品牌專賣店，步行街上還不乏精益眼鏡店、亨達利鐘錶店這樣的百年老店。</p><p>周邊的小路上，可以吃到武漢當地美食小吃：熱乾麵、周黑鴨、牛肉粉、豆皮等。</p>", "w": "AccuWeather 目前只預報到 12/04，這天還沒有預報。前幾天的趨勢是：平地白天約 18–20°C、夜間約 11–13°C，連日有雨。江邊風大，晚上逛江漢路請帶外套與雨具。出發前三天再更新。", "f": "熱乾麵、豆皮、牛肉粉、麵窩。周黑鴨：滷製鴨脖、鴨翅，偏辣。岳陽洞庭銀魚、君山銀針茶可選購。茶顏悅色、瑞幸在江漢路一帶門市多。", "p": "獨照：湖邊站姿，一手指天。夫妻照：江邊欄杆，燈光當背景。朋友照：江漢路老建築前斜排。團體照：岳陽樓前三排。", "pt": "拍照建議（岳陽樓、江灘）", "e": [["🍴 江漢路步行街－美食建議", "<ul><li><b>矮子餡餅</b>：湖北荊門特色千層酥皮點心，現烤出爐，常見紅糖、黑芝麻、綠豆、桂花等口味。</li><li><b>懶懶麻糍</b>：外皮Q彈、裹上花生粉與芝麻粉的排隊甜品。</li><li><b>烤不島羊肉大串</b>：肥瘦適中，孜然與辣椒粉炭火現烤，香氣四溢。</li></ul>"]]}, {"s": "【國泰航空 CX937／CX458】【返程溫馨的家】", "tl": [["07:00", "早餐"], ["07:30", "出發前往天河機場，約47公里、約1–1.5小時"], ["09:15", "機場辦理登機"], ["11:45–14:10", "CX937 武漢→香港"], ["14:10–16:45", "香港轉機：先補水，想喝咖啡可再去 Bacha Coffee 夿萐咖啡，配牛角可頌；16:15 前回到登機門"], ["16:45–18:15", "CX458 香港→高雄，回到溫馨的家"]]}];X.forEach((o,i)=>Object.assign(D[i],o));
